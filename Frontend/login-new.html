<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patent Gap AI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --background: hsl(210, 20%, 98%);
      --foreground: hsl(222, 47%, 11%);
      --card: hsl(0, 0%, 100%);
      --card-foreground: hsl(222, 47%, 11%);
      --primary: hsl(170, 70%, 8%);
      --primary-foreground: hsl(0, 0%, 100%);
      --secondary: hsl(210, 40%, 96%);
      --muted: hsl(210, 40%, 96%);
      --muted-foreground: hsl(215, 16%, 47%);
      --destructive: hsl(0, 72%, 51%);
      --border: hsl(214, 32%, 91%);
      --input: hsl(214, 32%, 91%);
      --radius: 0.5rem;
      --shadow-sm: 0 1px 2px 0 hsl(0 0% 0% / 0.05);
      --shadow-lg: 0 10px 15px -3px hsl(0 0% 0% / 0.1), 0 4px 6px -4px hsl(0 0% 0% / 0.1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, 
        hsl(210, 20%, 98%), 
        hsl(210, 20%, 98%), 
        hsl(210, 40%, 96%));
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-container {
      width: 100%;
      max-width: 448px;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .login-header {
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .login-icon-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .login-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: hsl(170, 70%, 8%, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 24px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--muted-foreground);
    }

    .login-content {
      padding: 24px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--foreground);
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted-foreground);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border: 1px solid var(--input);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      background: var(--background);
      color: var(--foreground);
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px hsl(170, 70%, 8%, 0.1);
    }

    .form-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-message {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: hsl(0, 72%, 51%, 0.1);
      border: 1px solid hsl(0, 72%, 51%, 0.2);
      border-radius: var(--radius);
      color: var(--destructive);
      font-size: 14px;
    }

    .error-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: var(--primary-foreground);
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover:not(:disabled) {
      background: hsl(170, 70%, 8%, 0.9);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--primary-foreground);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .test-credentials {
      margin-top: 24px;
      padding: 16px;
      background: hsl(210, 40%, 96%, 0.5);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .test-credentials-text {
      font-size: 12px;
      color: var(--muted-foreground);
      text-align: center;
      line-height: 1.6;
    }

    .test-credentials-text strong {
      color: var(--foreground);
      font-weight: 600;
    }

    .test-credentials-text code {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      background: var(--muted);
      padding: 2px 4px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon-wrapper">
          <div class="login-icon">🔒</div>
        </div>
        <h1 class="login-title">Patent Gap AI</h1>
        <p class="login-subtitle">Sign in to your account to continue</p>
      </div>

      <div class="login-content">
        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                id="email"
                class="form-input"
                placeholder="user@example.com"
                required
                autocomplete="email"
                disabled
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
                disabled
              />
            </div>
          </div>

          <div id="errorContainer" style="display: none;">
            <!-- Error message will be inserted here -->
          </div>

          <button type="submit" class="submit-btn" id="submitBtn" disabled>
            <span id="btnText">Sign In</span>
            <span id="btnSpinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <div class="test-credentials">
          <p class="test-credentials-text">
            <strong>Test Credentials:</strong><br>
            Email: <code>user@example.com</code><br>
            Password: <code>password123</code>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:5000';

    // Enable form inputs after page load
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('email').disabled = false;
      document.getElementById('password').disabled = false;
      document.getElementById('submitBtn').disabled = false;

      // Check if already logged in
      checkAuthentication();
    });

    // Check if user is already authenticated
    function checkAuthentication() {
      try {
        const sessionData = JSON.parse(localStorage.getItem('session') || '{}');
        if (sessionData.user_id || sessionData.user?.id) {
          // User is logged in, redirect to home
          window.location.href = 'home';
        }
      } catch (error) {
        // Not authenticated, stay on login page
      }
    }

    // Handle login form submission
    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const errorContainer = document.getElementById('errorContainer');

      // Clear previous errors
      errorContainer.style.display = 'none';
      errorContainer.innerHTML = '';

      // Validate inputs
      if (!email || !password) {
        showError('Please enter both email and password');
        return;
      }

      // Show loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Logging in...';
      btnSpinner.style.display = 'block';

      try {
        // Call login API
        const response = await fetch(`${API_BASE_URL}/api/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          // Handle error response
          const errorMsg = data.message || data.error || 'Login failed. Please check your credentials and try again.';
          throw new Error(errorMsg);
        }

        // Login successful
        if (data.success || response.status === 200) {
          // Store session data in localStorage
          const sessionData = {
            user_id: data.user_id || data.user?.id || data.id,
            email: data.email || email,
            user: data.user || {
              id: data.user_id || data.id,
              email: data.email || email
            },
            token: data.token || data.sessionToken || null
          };

          localStorage.setItem('session', JSON.stringify(sessionData));

          // Redirect to home
          window.location.href = 'home';
        } else {
          throw new Error(data.message || 'Login failed');
        }

      } catch (error) {
        console.error('Login error:', error);
        
        // Show error message
        showError(error.message || 'Login failed. Please check your credentials and try again.');

        // Reset button state
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In';
        btnSpinner.style.display = 'none';
      }
    }

    // Show error message
    function showError(message) {
      const errorContainer = document.getElementById('errorContainer');
      errorContainer.innerHTML = `
        <div class="error-message">
          <span class="error-icon">⚠️</span>
          <span>${escapeHtml(message)}</span>
        </div>
      `;
      errorContainer.style.display = 'block';
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
